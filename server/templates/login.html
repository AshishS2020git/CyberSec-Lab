

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>CyberLab Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:#171a22;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        label {
            font-family: "Inter", sans-serif;
            font-size: 16px;
            font-weight: 500;
        }

        .login-box{
            width:380px;
            font-family:'Inter',sans-serif;
            font-weight: 500px;
            background:#1e222d;
            padding:35px;
            border-radius:20px;
            border:1px solid rgba(255,255,255,.03);
            box-shadow:12px 12px 24px #0d0f14, -8px -8px 18px #2a3040;
        }

        h1{
            text-align:center;
            margin-bottom:5px;
            color:#a993ff;
        }

        .subtitle{
            text-align:center;
            color:#a7aec2;
            margin-bottom:30px;
            font-size:14px;
            font-family:'Inter',sans-serif;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            background:#13161d;
            color:white;
            border:1px solid rgba(255,255,255,.03);
            outline:none;
            font-size:15px;
            box-shadow:inset 4px 4px 8px #0e1016, inset -3px -3px 7px #262c39;
        }

        input:focus{
            border:1px solid #8f72ff;
            box-shadow:inset 3px 3px 7px #0e1016, inset -2px -2px 6px #262c39, 0 0 0 3px rgba(112,71,255,.18);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:linear-gradient(145deg,#815dff,#5530d6);
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            background:linear-gradient(145deg,#9478ff,#6340e8);
            box-shadow:inset 3px 3px 7px #4626b5, inset -2px -2px 5px #9b82ff;
        }

        .error{
            background:#35222b;
            padding:10px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:#a7aec2;
            font-size:12px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1><i class="fa-solid fa-shield-halved"></i> CyberLab</h1>

    <div class="subtitle">
       <b>Administrator Login</b> 
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
            autocomplete="off"
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            <b>Login</b>
        </button>

    </form>

    <div class="footer">
        CyberLab Management Console
    </div>

</div>

</body>
</html>
