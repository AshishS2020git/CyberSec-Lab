

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>CyberLab Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:#161b22; 
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            color:white;
        }

        label {
            font-family: "Inter", sans-serif;
            font-size: 16px;
            font-weight: 500;
        }

        .login-box{
            width:380px;
            font-family:'Inter',sans-serif;
            font-weight: 500px;
            background:#000103;
            padding:35px;
            border-radius:12px;
            border:1px solid #1e85ed;
            box-shadow:0 0 30px rgba(0,0,0,.45);
        }

        h1{
            text-align:center;
            margin-bottom:5px;
            color:#58a6ff;
        }

        .subtitle{
            text-align:center;
            color:#8b949e;
            margin-bottom:30px;
            font-size:14px;
            font-family:'Inter',sans-serif;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:none;
            border-radius:6px;
            background:#21262d;
            color:white;
            outline:none;
            font-size:15px;
        }

        input:focus{
            border:1px solid #58a6ff;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#238636;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            background:#2ea043;
        }

        .error{
            background:#8b0000;
            padding:10px;
            border-radius:6px;
            margin-bottom:15px;
            text-align:center;
        }

        .footer{
            text-align:center;
            margin-top:20px;
            color:#8b949e;
            font-size:12px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1><i class="fa-solid fa-shield-halved"></i> CyberLab</h1>

    <div class="subtitle">
       <b>Administrator Login</b> 
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
            autocomplete="off"
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            <b>Login</b>
        </button>

    </form>

    <div class="footer">
        CyberLab Management Console
    </div>

</div>

</body>
</html>
